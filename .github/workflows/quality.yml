name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Run quality checks
        run: make quality DESTINATION='platform=iOS Simulator,name=iPhone 16e,OS=26.2'

      - name: Upload test results after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WhoPays-test-results
          path: .build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
